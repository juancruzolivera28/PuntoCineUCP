<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuntoCine — Ficha de película</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="nav__logo">Punto<span>Cine</span></a>
      <ul class="nav__links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="listado_tabla.html">Cartelera (tabla)</a></li>
        <li><a href="listado_box.html">Cartelera (box)</a></li>
        <li>
          <details class="nav__dropdown">
            <summary>Cines</summary>
            <ul class="nav__dropdown__menu">
              <li><a href="cines/las-tipas.html">Las Tipas</a></li>
              <li><a href="cines/imax.html">IMAX</a></li>
              <li><a href="cines/sunstar.html">Sunstar</a></li>
            </ul>
          </details>
        </li>
        <li><a href="butacas.html">Butacas</a></li>
        <li><a href="comprar.html">Comprar entradas</a></li>
        <li id="nav-auth" class="auth-nav"></li>
      </ul>
    </nav>
  </header>

  <main>

  <section class="section container">
    <p class="muted"><a href="listado_box.html">&lsaquo; Volver a la cartelera</a></p>

    <div class="product" id="ficha-pelicula" aria-live="polite">
      <div class="poster poster--lg" id="ficha-poster">
        <span class="poster__title" id="ficha-poster-titulo"></span>
      </div>

      <div class="product__info">
        <div class="card__meta" id="ficha-meta" style="margin-bottom:12px;"></div>

        <h1 id="ficha-titulo"></h1>

        <p id="ficha-sinopsis"></p>

        <dl>
          <dt>Dirección</dt>
          <dd id="ficha-director"></dd>
          <dt>Elenco</dt>
          <dd id="ficha-elenco"></dd>
          <dt>Idioma</dt>
          <dd id="ficha-idioma"></dd>
          <dt>Cine</dt>
          <dd id="ficha-cine"></dd>
        </dl>

        <h3 style="font-size:1.1rem; margin-bottom:8px;">Elegí una función para comprar</h3>
        <div class="showtimes" id="ficha-funciones"></div>
      </div>
    </div>
  </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Las Tipas · IMAX · Sunstar — Posadas, Misiones</span>
    </div>
  </footer>

  <script src="js/peliculas.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
